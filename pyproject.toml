[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bw-causal"
version = "0.1.0"
description = "Honest causal forests for Bures–Wasserstein covariance barycenters"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.13,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
